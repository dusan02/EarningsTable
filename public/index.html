        var saved = localStorage.getItem('theme');

        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>

    <!-- JSON-LD: FAQPage (GEO — AI engines prefer FAQ schema for question answering) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What companies are reporting earnings today?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Earnings Table provides a daily earnings calendar showing all companies reporting earnings each trading day. Visit earningstable.com to see today's earnings reports with market cap, EPS surprises, revenue surprises, and stock price changes."
          }
        },
        {
          "@type": "Question",
          "name": "How do I track earnings reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the Earnings Table calendar to browse earnings by date. Select any day to see all companies reporting that day, with financial data including EPS actual vs estimate, revenue actual vs estimate, market cap, and price changes."
          }
        },
        {
          "@type": "Question",
          "name": "What is an EPS surprise?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EPS surprise is the percentage difference between a company's actual earnings per share and the analyst consensus estimate. A positive surprise means the company beat expectations; a negative surprise means it missed."
          }
        },
        {
          "@type": "Question",
          "name": "What is a revenue surprise?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Revenue surprise is the percentage difference between actual revenue and the analyst consensus revenue estimate. It indicates whether a company's top-line performance exceeded or fell short of market expectations."
          }
        },
        {
          "@type": "Question",
          "name": "Where does the earnings data come from?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Earnings data is sourced from Finnhub (earnings calendar) and Polygon (prices, fundamentals, logos). The dashboard is independent and not affiliated with any financial institution."
          }
        }
      ]
    }
    </script>

    <!-- JSON-LD: Dataset -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Dataset",
      "name": "Daily Company Earnings Data",
      "description": "Earnings reports including EPS actual vs estimate, revenue actual vs estimate, market cap, and stock price changes for companies reporting earnings.",
      "url": "https://earningstable.com/",
      "creator": { "@type": "Organization", "name": "Earnings Table" },
      "license": "https://earningstable.com/license",
      "isAccessibleForFree": true,
      "keywords": "earnings, EPS, revenue, market cap, financial data",
      "temporalCoverage": "2024-01-01/..",
      "variableMeasured": [
        { "@type": "PropertyValue", "name": "EPS Actual", "unitText": "USD" },
        { "@type": "PropertyValue", "name": "EPS Estimate", "unitText": "USD" },
        { "@type": "PropertyValue", "name": "EPS Surprise", "unitText": "%" },
        { "@type": "PropertyValue", "name": "Revenue Actual", "unitText": "USD" },
        { "@type": "PropertyValue", "name": "Revenue Estimate", "unitText": "USD" },
        { "@type": "PropertyValue", "name": "Revenue Surprise", "unitText": "%" },
        { "@type": "PropertyValue", "name": "Market Cap", "unitText": "USD" },
        { "@type": "PropertyValue", "name": "Price Change", "unitText": "%" }
      ]
    }
    </script>
